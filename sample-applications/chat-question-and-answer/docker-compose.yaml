# Compose reads .env for interpolation; the Fedora runner also passes it explicitly.
services:
  nginx:
    image: nginxinc/nginx-unprivileged:latest
    ports:
      - "8101:8101"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
    depends_on:
      - chatqna 
      - chatqna-ui
      - dataprep_pgvector 
    networks:
      - my_network
  chatqna:
    image: ${BE_IMAGE_NAME}
    build:
      context: .
    ports:
      - "8100:8080"
    environment:
      - no_proxy=${no_proxy},metrics-manager,model-download,text-generation,tei-embedding-service,host.containers.internal
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - ENDPOINT_URL=${ENDPOINT_URL}
      - EMBEDDING_ENDPOINT_URL=${EMBEDDING_ENDPOINT_URL}
      - INDEX_NAME=${INDEX_NAME}
      - FETCH_K=${FETCH_K}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL_NAME}
      - PG_CONNECTION_STRING=${PG_CONNECTION_STRING}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - HF_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - LLM_MODEL=${LLM_MODEL}
      - SEED=${SEED}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTLP_ENDPOINT:+${OTLP_ENDPOINT}/v1/traces}
      - OTEL_SERVICE_NAME=${OTLP_ENDPOINT:+${OTLP_SERVICE_NAME}}
      - OTEL_SERVICE_ENV=${OTLP_ENDPOINT:+${OTLP_SERVICE_ENV}}
      - OTEL_SERVICE_VERSION=${OTLP_ENDPOINT:+${OTEL_SERVICE_VERSION}}
      - REQUESTS_CA_BUNDLE=${REQUESTS_CA_BUNDLE:-}
      - RERANKER_ENDPOINT=${RERANKER_ENDPOINT}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      #- HOST_IP=${HOST_IP}
    networks:
      - my_network
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - "${CA_CERTIFICATES_PATH:-/etc/ssl/certs}:/opt/share/ca-certificates"
      - "${SSL_CERTIFICATES_PATH:-/etc/ssl/certs}:/etc/ssl/certs"
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: pgvector_db
    environment:
      - POSTGRES_USER=${PGVECTOR_USER}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD}
      - POSTGRES_DB=${PGVECTOR_DBNAME}
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGVECTOR_USER} -d ${PGVECTOR_DBNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my_network

  minio-server:
    image: docker.io/rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?error}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?error}
    command: ["server", "--address", ":9000", "--console-enable", "--console-address", ":9001", "/data"]
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - my_network

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    container_name: reranker_tei
    ports:
      - "8090:7777"
    volumes:
      - "${model_cache_path:-~/.cache/huggingface}:/root/.cache/huggingface"
    environment:
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - MODEL_ID=${RERANKER_MODEL}
    networks:
      - my_network
    command: --model-id ${RERANKER_MODEL} --auto-truncate

  dataprep_pgvector:
    image: ${REGISTRY:-}document-ingestion:latest
    container_name: dataprep_pgvector
    environment:
      no_proxy: ${no_proxy},tei-embedding-service,minio-server
      https_proxy: ${https_proxy}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      INDEX_NAME: ${INDEX_NAME}
      TEI_ENDPOINT_URL: ${EMBEDDING_ENDPOINT_URL}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      BATCH_SIZE: ${BATCH_SIZE}
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN}
      HF_TOKEN: ${HUGGINGFACEHUB_API_TOKEN}
      MINIO_HOST: minio-server
      MINIO_API_PORT: ${MINIO_API_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?error}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?error}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?error}
    ports:
      - "8000:8000"
    depends_on:
      pgvector:
        condition: service_healthy
      minio-server:
        condition: service_healthy
    networks:
      - my_network

  chatqna-ui:
    image: ${FE_IMAGE_NAME}
    container_name: chatqna-ui
    build:
      context: ./ui/react/
    ports:
      - "5173:8101"
    networks:
      - my_network
    environment:
      - no_proxy=${no_proxy}
      - https_proxy=${https_proxy}
      - http_proxy=${http_proxy}
      - APP_ENDPOINT_URL=${APP_ENDPOINT_URL}
      - APP_DATA_PREP_URL=${APP_DATA_PREP_URL}
      - APP_MAX_TOKENS=${APP_MAX_TOKENS}
      - APP_SYSTEM_INFO=${APP_SYSTEM_INFO:-}

  metrics-manager:
    image: localhost/${REGISTRY:-}metrics-manager:${TAG:-latest}
    build:
      context: ../../microservices/metrics-manager
      dockerfile: Dockerfile
    container_name: metrics-manager
    privileged: ${PRIVILEGED:-true}
    apparmor: ${APPARMOR:-unconfined}
    userns_mode: ${CONTAINER_USERNS_MODE:-host}
    environment:
      - METRICS_PORT=9090
      - TELEGRAF_PORT=9273
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - METRICS_MANAGER_HOSTNAME=${METRICS_MANAGER_HOSTNAME:-}
    ports:
      - "${HOST_METRICS_PORT:-9090}:9090"
      - "${HOST_TELEGRAF_PORT:-9273}:9273"
      - "${HOST_TELEGRAF_HTTP_PORT:-8186}:8186"
    group_add:
      - ${RENDER_DEVICE_GID:-0}
    security_opt:
      - apparmor:unconfined
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /sys:/sys:ro
      - ../../microservices/metrics-manager/telegraf.conf:/etc/telegraf/telegraf.conf:ro,Z
      - ../../microservices/metrics-manager/telegraf.d:/etc/telegraf/telegraf.d:ro,Z
      - ../../microservices/metrics-manager/scripts/intel_gpu_top_reader.py:/app/scripts/intel_gpu_top_reader.py:ro,Z
      - metrics-custom:/app/custom-metrics
    pid: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - my_network

  model-download:
    image: localhost/${REGISTRY:-}model-download:${TAG:-latest}
    build:
      context: ../../microservices/model-download
      dockerfile: docker/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${USER_GROUP_ID:-1000}
    container_name: model-download
    userns_mode: ${CONTAINER_USERNS_MODE:-host}
    command: ["--plugins", "${MODEL_DOWNLOAD_PLUGINS:-all}"]
    environment:
      - no_proxy=${no_proxy:-},model-download,host.containers.internal
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - HF_TOKEN=${HUGGINGFACEHUB_API_TOKEN:-}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN:-}
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
      - STARTUP_MODELS_CONFIG=/opt/startup-models.yaml
      - ENABLED_PLUGINS=${MODEL_DOWNLOAD_PLUGINS:-all}
      - MODEL_PATH=/opt/models
      - MODEL_REPOSITORY_PATH=/opt/models
      - OVMS_RELEASE_TAG=${OVMS_RELEASE_TAG:-v2025.4.1}
    ports:
      - "${MODEL_DOWNLOAD_HOST_PORT:-8200}:8000"
    volumes:
      - "${MODEL_PATH:-./ovms/models}:/opt/models:z"
      - type: bind
        source: ${STARTUP_MODELS_CONFIG_HOST_PATH:-./startup-models-cpu.yaml}
        target: /opt/startup-models.yaml
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - ./scripts/check_model_download_ready.py:/opt/chatqna/check_model_download_ready.py:ro,Z
    group_add:
      - ${USER_GROUP_ID:-1000}
    healthcheck:
      test: ["CMD", "python", "/opt/chatqna/check_model_download_ready.py"]
      interval: 30s
      timeout: 15s
      retries: 120
      start_period: 10m
    restart: unless-stopped
    networks:
      - my_network

  # ovms-config-init:
  #   image: ovms-config-init:latest
  #   profiles:
  #     - OVMS
  #     - GPU-OVMS
  #   entrypoint: ["python"]
  #   command: ["/opt/chatqna/generate_ovms_config.py"]
  #   environment:
  #     - LLM_MODEL=${LLM_MODEL}
  #     - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
  #     - MODEL_REPOSITORY_PATH=/opt/models
  #   volumes:
  #     - "${MODEL_PATH:-./ovms/models}:/opt/models:z"
  #     - ./scripts/generate_ovms_config.py:/opt/chatqna/generate_ovms_config.py:ro,Z
  #   depends_on:
  #     model-download:
  #       condition: service_healthy
  #   networks:
  #     - my_network

  #Model Server
  vllm-service:
    image: opea/vllm-openvino:latest
    profiles:
      - VLLM
    container_name: vllm-openvino-server
    ports:
      - "8080:80"
    volumes:
      - "${model_cache_path:-~/.cache/huggingface}:/root/.cache/huggingface"
      - "${CA_CERTIFICATES_PATH:-/etc/ssl/certs}:/opt/share/ca-certificates"
      - "${SSL_CERTIFICATES_PATH:-/etc/ssl/certs}:/etc/ssl/certs"
    environment:
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - LLM_MODEL=${LLM_MODEL}
      - VLLM_CPU_KVCACHE_SPACE=${KVCACHE_SPACE}
      - VLLM_OPENVINO_KVCACHE_SPACE=${KVCACHE_SPACE}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE}
      - VLLM_OPENVINO_CPU_KV_CACHE_PRECISION=u8
      - VLLM_OPENVINO_ENABLE_QUANTIZED_WEIGHTS=ON
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_SERVICE_NAME=${OTLP_ENDPOINT:+${OTLP_SERVICE_NAME}}
      - OTEL_SERVICE_ENV=${OTLP_ENDPOINT:+${OTLP_SERVICE_ENV}}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
      - OTLP_ENDPOINT_TRACE=${OTLP_ENDPOINT:+${OTLP_ENDPOINT_TRACE}}
      - REQUESTS_CA_BUNDLE=${REQUESTS_CA_BUNDLE:-}
    cap_add:
      - SYS_NICE
    healthcheck:
      test: [ "CMD", "httpx", "http://localhost/health", "-m", "GET" ]
      interval: 120s
      timeout: 10s
      retries: 3
    networks:
      - my_network
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -n "$OTLP_ENDPOINT" ]; then
          pip install "opentelemetry-sdk>=1.26.0,<1.27.0" "opentelemetry-api>=1.26.0,<1.27.0" "opentelemetry-exporter-otlp>=1.26.0,<1.27.0" "opentelemetry-semantic-conventions-ai>=0.4.1,<0.5.0" opentelemetry-instrumentation-fastapi && \
          opentelemetry-instrument python3 -m vllm.entrypoints.openai.api_server --enforce-eager --model $LLM_MODEL --tensor-parallel-size $TENSOR_PARALLEL_SIZE --host 0.0.0.0 --port 80;
        else
          python3 -m vllm.entrypoints.openai.api_server --enforce-eager --model $LLM_MODEL --tensor-parallel-size $TENSOR_PARALLEL_SIZE --host 0.0.0.0 --port 80;
        fi

  text-generation:
    image: ghcr.io/huggingface/text-generation-inference:3.3.7-intel-xpu
    command: --model-id ${LLM_MODEL} --cuda-graphs 0
    profiles:
      - TGI
    container_name: text-generation
    environment:
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - HF_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
    ports:
      - "8080:80"
    volumes:
      - "${model_cache_path:-~/.cache/huggingface}:/root/.cache/huggingface"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 120s
      timeout: 10s
      retries: 3
    networks:
      - my_network
    shm_size: "1g"

  ovms-service:
    image: openvino/model_server:${OVMS_RELEASE_TAG:-latest}
    container_name: ovms-service
    profiles:
      - OVMS
    environment:
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
    ulimits:
      nofile:
        soft: 16384
        hard: 65536
    ports:
      - "9300:9300"
      - "8300:8080"
    volumes:
      - "${MODEL_PATH:-./ovms/models}:/workspace/models:ro"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v2/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: [ "--port", "9300", "--rest_port", "8080", "--log_level", "DEBUG", "--config_path", "/workspace/models/config_all.json" ]
    networks:
      - my_network

  #Embedding Services
  tei-embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    profiles:
      - TEI
    container_name: tei-embedding-service
    ports:
      - "6006:80"
    volumes:
      - "${model_cache_path:-~/.cache/huggingface}:/root/.cache/huggingface"
    shm_size: 1g
    networks:
      - my_network
    environment:
      no_proxy: ${no_proxy}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
    command: --model-id ${EMBEDDING_MODEL_NAME} --auto-truncate
    mem_limit: 4g
    mem_reservation: 4g


  ovms-service-gpu:
    image: openvino/model_server:${OVMS_RELEASE_TAG_GPU:-latest-gpu}
    container_name: ovms-service
    profiles:
      - GPU-OVMS
    environment:
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
    ulimits:
      nofile:
        soft: 16384
        hard: 65536
    ports:
      - "9300:9300"
      - "8300:8080"
    volumes:
      - "${MODEL_PATH:-./ovms/models}:/workspace/models:ro"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${RENDER_DEVICE_GID:-0}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v2/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: [ "--port", "9300", "--rest_port", "8080", "--log_level", "DEBUG", "--config_path", "/workspace/models/config_all.json" ]
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  metrics-custom:
  object-store-data:
  pgvector-data:
